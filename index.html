<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5秒ストップウォッチゲーム</title>
    <style>
        /* 全体の設定 */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- キャリアごとの背景色 --- */
        body.bg-au {
            background-color: #fff0e0; /* au：薄いオレンジ */
        }
        body.bg-docomo {
            background-color: #ffeef0; /* ドコモ：薄い赤（ピンク） */
        }
        body.bg-softbank {
            background-color: #eef5ff; /* ソフトバンク：薄い青 */
        }

        /* 成功したときは一番優先して全面黄色にする */
        body.success {
            background-color: #ffff00 !important;
        }

        /* メッセージエリア（2行になっても崩れないように調整） */
        #message {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 20px;
            min-height: 150px;
            display: flex;
            flex-direction: column; /* 文字を縦にきれいに並べる */
            align-items: center;
            justify-content: center;
        }

        /* ゲーム終了時に出るキャリア情報の文字スタイル */
        .carrier-result {
            font-size: 0.65em;
            color: #444444;
            margin-top: 12px;
            background-color: rgba(255, 255, 255, 0.7); /* 後ろの色に負けないように白幕を敷く */
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
        }

        /* タイマーの数字エリア */
        #timer {
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: bold;
            margin-bottom: 40px;
            color: #333333;
        }

        /* 巨大な赤色ボタン */
        #actionButton {
            width: clamp(260px, 60vw, 350px);
            height: clamp(260px, 60vw, 350px);
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #actionButton:active {
            transform: scale(0.92);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 0.45em;
            font-weight: normal;
            letter-spacing: 0.1em;
            padding-bottom: 0.2em;
        }
    </style>
</head>
<body>

    <div id="message">
        <ruby>調<rt>しら</rt></ruby>べているよ。ちょっと待ってね…
    </div>

    <div id="timer">
        0.00<ruby>秒<rt>びょう</rt></ruby>
    </div>

    <button id="actionButton">
        <ruby>始<rt>はじ</rt></ruby>める
    </button>

    <script>
        const button = document.getElementById('actionButton');
        const message = document.getElementById('message');
        const timer = document.getElementById('timer');
        const body = document.body;

        let startTime;
        let timerId;
        let isRunning = false;

        // いま何のキャリアかを覚えておく変数（文字とふりがな付き）
        let carrierText = 'その他の<ruby>回線<rt>かいせん</rt></ruby>（<ruby>白<rt>しろ</rt></ruby>）';

        // --- ページが開いた瞬間に、どこの通信会社（キャリア）か調べる処理 ---
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const orgName = data.org ? data.org.toLowerCase() : '';
                    
                    if (orgName.includes('kddi') || orgName.includes('okinawa cellular')) {
                        body.classList.add('bg-au');
                        // au用のテキスト（オレンジにふりがな）
                        carrierText = 'ａｕ（<ruby>オ<rt>お</rt></ruby><ruby>レ<rt>れ</rt></ruby><ruby>ン<rt>ん</rt></ruby><ruby>ジ<rt>じ</rt></ruby>）';
                    } else if (orgName.includes('docomo')) {
                        body.classList.add('bg-docomo');
                        // ドコモ用のテキスト（ピンクにふりがな）
                        carrierText = 'ドコモ（<ruby>ピ<rt>ぴ</rt></ruby><ruby>ン<rt>ん</rt></ruby><ruby>ク<rt>く</rt></ruby>）';
                    } else if (orgName.includes('softbank')) {
                        body.classList.add('bg-softbank');
                        // ソフトバンク用のテキスト（青にふりがな）
                        carrierText = 'ソフトバンク（<ruby>青<rt>あお</rt></ruby>）';
                    }
                    
                    message.innerHTML = '<ruby>ボ<rt>ぼ</rt></ruby>タ<ruby>ン<rt>ん</rt></ruby>を <ruby>押<rt>お</rt></ruby>すと <ruby>始<rt>はじ</rt></ruby>まるよ！';
                })
                .catch(error => {
                    console.log('判定ができませんでした');
                    message.innerHTML = '<ruby>ボ<rt>ぼ</rt></ruby>タ<ruby>ン<rt>ん</rt></ruby>を <ruby>押<rt>お</rt></ruby>すと <ruby>始<rt>はじ</rt></ruby>まるよ！';
                });
        });

        // --- ストップウォッチの動き ---
        button.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                body.classList.remove('success');
                button.innerHTML = '<ruby>止<rt>と</rt></ruby>める';
                message.innerHTML = '5<ruby>秒<rt>びょう</rt></ruby>ぴったりで <ruby>止<rt>と</rt></ruby>めてね！';
                
                startTime = performance.now();
                
                timerId = setInterval(() => {
                    const current = (performance.now() - startTime) / 1000;
                    timer.innerHTML = current.toFixed(2) + '<ruby>秒<rt>びょう</rt></ruby>';
                }, 10);

            } else {
                isRunning = false;
                clearInterval(timerId);
                
                button.innerHTML = '<ruby>も<rt>も</rt></ruby>う<ruby>一<rt>いっ</rt></ruby><ruby>回<rt>かい</rt></ruby>！';
                
                const stopTime = (performance.now() - startTime) / 1000;
                timer.innerHTML = stopTime.toFixed(2) + '<ruby>秒<rt>びょう</rt></ruby>';

                // --- ゲーム終了時の判定と色情報の表示 ---
                if (stopTime >= 4.90 && stopTime <= 5.10) {
                    // 大当たり（画面は黄色になるが、文字でキャリアを伝える）
                    body.classList.add('success');
                    message.innerHTML = `
                        <div>おめでとう！<ruby>景品<rt>けいひん</rt></ruby>をゲットしたよ！</div>
                        <div class="carrier-result">【 ${carrierText} で クリア！ 】</div>
                    `;
                } else {
                    // おしい（元のキャリア背景のまま、文字でも伝える）
                    body.classList.remove('success');
                    message.innerHTML = `
                        <div>おしい！</div>
                        <div class="carrier-result">【 ${carrierText} の 画面だったよ 】</div>
                    `;
                }
            }
        });
    </script>

</body>
</html>
