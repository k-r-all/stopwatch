<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5秒ストップウォッチゲーム</title>
    <style>
        /* 全体の設定：初期状態は白背景 */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.4s ease, border 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            border: 0px solid transparent; /* 最初は枠線なし */
        }

        /* au・UQ回線の時の背景色（薄いオレンジ） */
        body.bg-au {
            background-color: #fff0e0;
        }

        /* 成功したときは最優先で画面全体を黄色にする */
        body.success {
            background-color: #ffff00 !important;
        }

        /* 【色だけで判別する工夫】 */
        /* 成功（黄色画面）のとき、au・UQ回線なら画面の周りにオレンジの太い枠線を出す */
        body.success.bg-au {
            border: 25px solid #ff6600;
        }
        /* それ以外の回線の成功時は、白い枠線にして黄色を引き立たせる */
        body.success {
            border: 25px solid #ffffff;
        }

        /* メッセージエリア */
        #message {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* タイマーの数字エリア */
        #timer {
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: bold;
            margin-bottom: 40px;
            color: #333333;
        }

        /* 巨大な赤色ボタン */
        #actionButton {
            width: clamp(260px, 60vw, 350px);
            height: clamp(260px, 60vw, 350px);
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #actionButton:active {
            transform: scale(0.92);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div id="message">
        調べているよ。ちょっと待ね…
    </div>

    <div id="timer">
        0.00秒
    </div>

    <button id="actionButton">
        始める
    </button>

    <script>
        const button = document.getElementById('actionButton');
        const message = document.getElementById('message');
        const timer = document.getElementById('timer');
        const body = document.body;

        let startTime;
        let timerId;
        let isRunning = false;

        // --- ページが開いた瞬間に、au・UQ回線か調べる処理 ---
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const orgName = data.org ? data.org.toLowerCase() : '';
                    
                    // KDDI(au) または UQ関連の文字列が含まれているか判定
                    if (orgName.includes('kddi') || orgName.includes('okinawa cellular') || orgName.includes('uq')) {
                        body.classList.add('bg-au'); // オレンジ背景にする
                    }
                    
                    message.innerHTML = 'ボタンを押すと始まるよ！';
                })
                .catch(error => {
                    console.log('判定ができませんでした');
                    message.innerHTML = 'ボタンを押すと始まるよ！';
                });
        });

        // --- ストップウォッチの動き ---
        button.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                body.classList.remove('success');
                button.innerHTML = '止める';
                message.innerHTML = '5秒ぴったりで止めてね！';
                
                startTime = performance.now();
                
                timerId = setInterval(() => {
                    const current = (performance.now() - startTime) / 1000;
                    timer.innerHTML = current.toFixed(2) + '秒';
                }, 10);

            } else {
                isRunning = false;
                clearInterval(timerId);
                
                button.innerHTML = 'もう一回！';
                
                const stopTime = (performance.now() - startTime) / 1000;
                timer.innerHTML = stopTime.toFixed(2) + '秒';

                // --- ゲーム終了時の判定 ---
                if (stopTime >= 4.90 && stopTime <= 5.10) {
                    // 大当たり（画面は黄色。au/UQならさらにオレンジの枠線がつきます）
                    body.classList.add('success');
                    message.innerHTML = 'おめでとう！景品をゲットしたよ！';
                } else {
                    // おしい（画面は元のキャリアの色。au/UQならオレンジ、それ以外なら白）
                    body.classList.remove('success');
                    message.innerHTML = 'おしい！';
                }
            }
        });
    </script>

</body>
</html>
